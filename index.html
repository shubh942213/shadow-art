<style>

*{box-sizing:border-box}html,body{height:100%}
body{margin:0;font:13px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--txt);display:flex;flex-direction:column}

#topbar{flex:0 0 auto;display:flex;align-items:baseline;gap:10px;padding:12px 18px;background:linear-gradient(90deg,#15161c,#181a24);border-bottom:1px solid var(--line)}
#topbar h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
#topbar .ver{font-size:11px;color:var(--sub);border:1px solid var(--line);padding:2px 7px;border-radius:20px}
#topbar .tag{margin-left:auto;font-size:11.5px;color:var(--sub)}

#app{flex:1;min-height:0;display:grid;grid-template-columns:300px 1fr;gap:14px;padding:14px;overflow:hidden}

#side{overflow:auto;padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
#side>b{display:block;font-size:12px;color:var(--sub);font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}
#side label{display:grid;grid-template-columns:1fr 88px;gap:6px;margin:5px 0;align-items:center}
#side label span{color:#c7cbdb}
input,button,select{font:inherit}
input[type=number],input[type=text],select{width:88px;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:5px 7px;outline:none}
input[type=number]:focus,select:focus{border-color:var(--accent)}
input[type=file]{width:100%;color:var(--sub);font-size:12px}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent)}
button{background:var(--accent);color:#fff;border:0;padding:8px 12px;margin:4px 4px 4px 0;border-radius:7px;cursor:pointer;font-weight:600;transition:filter .15s}
button:hover{filter:brightness(1.12)}button.o{background:var(--panel2);color:var(--sub);border:1px solid var(--line)}
h4{margin:16px 0 6px;padding-top:10px;border-top:1px solid var(--line);color:var(--accent2);font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;font-weight:700}
h4:first-of-type{border-top:0;padding-top:0;margin-top:4px}
#side>br+button{width:calc(50% - 6px)}

#main{display:flex;flex-direction:column;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
#viewhead{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel2)}
#viewhead b{font-size:12.5px;letter-spacing:.3px}
#viewhead small{color:var(--sub)}
#tabs{margin-left:auto;display:flex;gap:6px}
#tabs button{margin:0;padding:6px 14px;border-radius:20px;font-size:12px}
#tabs button.o{background:transparent;border:1px solid var(--line)}
#cv{flex:1;min-height:0;width:100%;touch-action:none;cursor:grab;background:radial-gradient(circle at 50% 35%,#1b1e29,#101116 75%)}
#info{margin:0;padding:10px 14px;background:var(--panel2);border-top:1px solid var(--line);max-height:150px;overflow:auto;font-size:11.5px;line-height:1.5;white-space:pre-wrap;color:var(--sub);font-family:ui-monospace,Consolas,monospace}

@media(max-width:860px){#app{grid-template-columns:1fr;height:auto;overflow:visible}#side{max-height:none}#cv{height:60vh}}

#gate{position:fixed;inset:0;background:rgba(10,11,15,.92);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:999}
#gate form{background:var(--panel);border:1px solid var(--line);padding:28px;border-radius:14px;width:300px;font:14px system-ui;color:var(--txt);box-shadow:0 20px 60px rgba(0,0,0,.5)}

#gate input{width:100%;padding:9px;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:7px}
#gate button{width:100%;margin-top:16px;padding:10px;background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;border:0;border-radius:7px;cursor:pointer;font-weight:700}
#gate button:disabled{opacity:.6;cursor:default}
#gmsg{margin-top:10px;font-size:12px;min-height:14px}

FD.map(d=>d[0]=='#'?`<h4>${d[1]}</h4>`:`<label><span>${d[1]}</span><input type=number step=any id=${d[0]} value=${d[2]}></label>`).join('')+'<br><button id=bs>Download SVG</button><button id=bd>Download DXF</button>';
let P={},S=1,N=1024,G=new Float32Array(N*N),img=null,PN=[],GL=[],shDirty=1,tab=0,tm,cam={y:-.7,p:.5,z:1.5},dr=null;

function rd(){FD.forEach(d=>{if(d[0]!='#'){const v=parseFloat($(d[0]).value);P[d[0]]=isNaN(v)?d[2]:v}});

function ingest(){if(!img)return;const c=document.createElement('canvas');c.width=c.height=N;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0,N,N);const d=x.getImageData(0,0,N,N).data,iv=$('inv').checked;
 for(let i=0;i<N*N;i++){const a=d[4*i+3]/255,l=(.299*d[4*i]+.587*d[4*i+1]+.114*d[4*i+2])/255;G[i]=a*(iv?l:1-l)}}
function gs(u,v){if(u<0||v<0||u>1||v>1)return 0;let x=u*(N-1),y=v*(N-1),i=x|0,j=y|0;if(i>=N-1)i=N-2;if(j>=N-1)j=N-2;const fx=x-i,fy=y-j,k=j*N+i;

function mask(X,Y){const a=P.rot*Math.PI/180,ca=Math.cos(a),sa=Math.sin(a);X-=P.mx;Y-=P.my;return gs((X*ca+Y*sa)/P.sw+.5,.5-(-X*sa+Y*ca)/P.sl)}
// joinery helpers: tab centers along a panel's width, and the finger tooth pattern along height
function tabCenters(w){const n=Math.max(2,Math.floor(w/40)),step=w/n,arr=[];for(let i=0;i<n;i++)arr.push(-w/2+step*(i+.5));return arr}
function toothAt(z){return Math.floor(Math.min(P._nf-1,Math.max(0,(z-P.bt)/P._fh)))%2===0}
function inTab(p,s){for(const c of p.tabs)if(Math.abs(s-c)<=P.tabw/2)return true;return false}
// value of wall panel p at local (s along panel, z height): shadow cone ∩ wall plane, plus base rail + joinery
function pf(p,s,z){
 const half=p.w/2;
 if(P.join){
  if(z<P.bt)return inTab(p,s)?1:0;                              // tab plugs through the base plate

  if(p.notch&&Math.abs(s)>half-P.t&&toothAt(z))return 0;        // matching notch cut in
 }
 if(p.n=='Back'&&P.btn>0&&Math.hypot(s,z-(P.bt+P.rail/2))<=P.btn/2)return 0; // button hole

 const x=p.ax=='y'?p.o+p.sg*s:p.c,y=p.ax=='y'?p.c:p.o+p.sg*s,k=1+(S-1)*z/P.H;

function panels(){const{W,L,t,wx,wy}=P,w2=Math.max(L-2*t,1);return[

 {n:'Back',ax:'y',c:wy+(L/2-t/2),sg:-1,o:wx,w:W,notch:true,tabs:tabCenters(W)},
 {n:'Left',ax:'x',c:wx-(W/2-t/2),sg:-1,o:wy,w:w2,corner:true,tabs:tabCenters(w2)},
 {n:'Right',ax:'x',c:wx+(W/2-t/2),sg:1,o:wy,w:w2,corner:true,tabs:tabCenters(w2)}]}
// --- raster grid: build once, despeckle, bridge disconnected islands, kerf-dilate, then extract loops ---
function buildF(fn,x0,y0,x1,y1,h,lv){

function contour(fn,x0,y0,x1,y1,h,lv){const g=buildF(fn,x0,y0,x1,y1,h,lv);return extractLoops(g.F,g.X,g.Y,x0,y0,h)}
function components(F,X,Y){

 for(let s=0;s<X*Y;s++){if(F[s]<=0||lab[s]>=0)continue;const stack=[s];lab[s]=nc;const cells=[];
  while(stack.length){const k=stack.pop();cells.push(k);const a=k%X;
   const nbrs=[[k-1,a>0],[k+1,a<X-1],[k-X,true],[k+X,true]];
   for(const[nb,ok]of nbrs){if(!ok||nb<0||nb>=X*Y)continue;if(F[nb]>0&&lab[nb]<0){lab[nb]=nc;stack.push(nb)}}}

function boundaryPts(cells,F,X,x0,y0,h){

  if(F[k-1]<=0||F[k+1]<=0||F[k-X]<=0||F[k+X]<=0)pts.push([x0+(a-1)*h,y0+(b-1)*h])}

function segDist(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;let t=l?((px-ax)*dx+(py-ay)*dy)/l:0;t=Math.max(0,Math.min(1,t));

function paintBridge(F,X,Y,x0,y0,h,p,q,w){

 return[...textLines('F',0,-P.L/2+m-s/2,s),...textLines('B',0,P.L/2-m-s/2,s),...textLines('L',-P.W/2+m-s/2,0-s/2,s),...textLines('R',P.W/2-m-s/2,0-s/2,s)]}
const sd=(p,a,b)=>{const dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy;return l?Math.abs(dy*(p[0]-a[0])-dx*(p[1]-a[1]))/Math.sqrt(l):Math.hypot(p[0]-a[0],p[1]-a[1])};
function dp(P_,e){if(P_.length<3)return P_;let m=0,k=0;const a=P_[0],b=P_[P_.length-1];for(let i=1;i<P_.length-1;i++){const d=sd(P_[i],a,b);if(d>m){m=d;k=i}}

const bb=ls=>{let r=null;ls.forEach(l=>l.forEach(q=>{if(!r)r=[q[0],q[1],q[0],q[1]];else{r[0]=Math.min(r[0],q[0]);r[1]=Math.min(r[1],q[1]);r[2]=Math.max(r[2],q[0]);r[3]=Math.max(r[3],q[1])}}));return r};

function go(){rd();PN=buildPanels(Math.max(.4,Math.max(P.W,P.L)/150),0);const R=gr();GL=contour(mask,-R,-R,R,R,R/70,P.thr);shDirty=1;info();draw()}
function info(){let s=`Light at (0,0,${P.H}) above shadow centre. Electronics bay: bottom ${P.rail} mm of every wall is solid - room for a battery + switch before gluing the top on.\nPanels cut from ${P.t} mm sheet. Order in export: Front, Back, Left, Right, Base.\n`;
 s+=P.join?'Joinery ON: Left/Right have finger tabs into Front/Back at the corners, and every wall has tabs that plug through slots in the base.\n':'Joinery OFF: plain butt edges - glue Left/Right between Front/Back, and all 4 onto the base.\n';
 if(P.kerf>0)s+=`Kerf compensation ${P.kerf} mm applied on export (not shown in this preview).\n`;
 let tb=0,tr=0;
 PN.forEach(p=>{const q=bb(p.loops),tiny=p.loops.filter(l=>Math.abs(ar(l))<1).length;tb+=(p.bridges||[]).length;tr+=p.removed||0;
  s+=`${p.n}: ${p.w.toFixed(1)} x ${q?(q[3]-(P.join?0:P.bt)).toFixed(1):0} mm, ${p.loops.length} outlines${tiny?`, ${tiny} tiny (<1 mm²) - may fall out`:''}\n`});

function draw3(){const g=cv.getContext('2d'),w=cv.width=cv.clientWidth,h=cv.height=cv.clientHeight;g.clearRect(0,0,w,h);

 });

function drawSh(){const g=cv.getContext('2d'),w=cv.width=cv.clientWidth,h=cv.height=cv.clientHeight,M=320,R=gr();g.clearRect(0,0,w,h);
 if(shDirty){shc.width=shc.height=M;const x=shc.getContext('2d'),im=x.createImageData(M,M),d=im.data;
  for(let j=0;j<M;j++)for(let i=0;i<M;i++){const X=(i+.5)/M*2*R-R,Y=R-(j+.5)/M*2*R;let b=0;

// --- export layout: build pieces, rotate for a better fit, pack shelves ---
function insetRect(r,d){const xs=r.map(p=>p[0]),ys=r.map(p=>p[1]),x0=Math.min(...xs)-d,x1=Math.max(...xs)+d,y0=Math.min(...ys)-d,y1=Math.max(...ys)+d;return[[x0,y0],[x1,y0],[x1,y1],[x0,y1]]}
function baseSlots(){const rects=[];panels().forEach(p=>{p.tabs.forEach(cs=>{
  const wx_=p.ax=='y'?p.o+p.sg*cs:p.c,wy_=p.ax=='y'?p.c:p.o+p.sg*cs,hl=P.tabw/2,hw=P.t/2;
  rects.push(p.ax=='y'?[[wx_-hl,wy_-hw],[wx_+hl,wy_-hw],[wx_+hl,wy_+hw],[wx_-hl,wy_+hw]]:[[wx_-hw,wy_-hl],[wx_+hw,wy_-hl],[wx_+hw,wy_+hl],[wx_-hw,wy_+hl]])});});
 return rects}
function rotatePiece(p){const rp=q=>[-q[1],q[0]];return{L:p.L.map(l=>l.map(rp)),T:(p.T||[]).map(l=>l.map(rp)),c:p.c.map(c=>[-c[1],c[0],c[2]])}}
function packSheet(pieces){
 const items=pieces.map(p=>{
  const b0=bb(p.L),w0=b0[2]-b0[0],h0=b0[3]-b0[1];
  const rp=rotatePiece(p),b1=bb(rp.L),w1=b1[2]-b1[0],h1=b1[3]-b1[1];
  let use=p,b=b0,w=w0,h=h0;
  if(w1<=P.sheet&&(h1<h0||w0>P.sheet)){use=rp;b=b1;w=w1;h=h1}
  return{p:use,b,w,h}});
 items.sort((a,b)=>b.h-a.h);
 let cx=0,cy=0,rh=0,tw=0;
 items.forEach(it=>{if(cx>0&&cx+it.w>P.sheet){cx=0;cy+=rh+P.gap;rh=0}
  it.p.o=[cx-it.b[0],cy-it.b[1]];cx+=it.w+P.gap;rh=Math.max(rh,it.h);tw=Math.max(tw,cx-P.gap)});
 return{pcs:items.map(it=>it.p),tw,th:cy+rh}}
function layout(){
 rd();const st=Math.max(.03,Math.min(P.res,P.bw>0?P.bw/4:P.res,P.kerf>0?P.kerf/3:P.res,P.join?P.t/6:P.res));
 const built=buildPanels(st,P.kerf);
 const pcs=built.map(p=>({L:p.loops.map(l=>l.map(q=>[q[0],q[1]-(P.join?0:P.bt)])),c:[],T:P.lbl_on?wallLabel(p):[]}));
 const k2=P.kerf>0?P.kerf/2:0;
 const B=insetRect([[-P.W/2,-P.L/2],[P.W/2,-P.L/2],[P.W/2,P.L/2],[-P.W/2,P.L/2]],k2);
 const slots=P.join?baseSlots().map(r=>insetRect(r,-k2)):[];
 const c=[];if(P.cd>0)c.push([-P.wx,-P.wy,Math.max(.1,P.cd/2-k2)]);
 if(P.md>0)[1,-1].forEach(k=>c.push([-P.wx,k*P.mdist-P.wy,Math.max(.1,P.md/2-k2)]));
 pcs.push({L:[B,...slots],c,T:P.lbl_on?baseLabels():[]});
 return packSheet(pcs)}
function svg(){const{pcs,tw,th}=layout(),f=(x,y)=>x.toFixed(3)+','+(th-y).toFixed(3);

 s+='<g fill="none" stroke="#f00" stroke-width="0.1">';
 pcs.forEach(p=>{p.L.forEach(l=>s+=`<path d="M${l.map(q=>f(q[0]+p.o[0],q[1]+p.o[1])).join(' L')}Z"/>`);p.c.forEach(c=>s+=`<circle cx="${(c[0]+p.o[0]).toFixed(3)}" cy="${(th-c[1]-p.o[1]).toFixed(3)}" r="${c[2]}"/>`)});
 s+='</g><g fill="none" stroke="#08f" stroke-width="0.1">';
 pcs.forEach(p=>{(p.T||[]).forEach(l=>s+=`<path d="M${l.map(q=>f(q[0]+p.o[0],q[1]+p.o[1])).join(' L')}"/>`)});
 return s+'</g></svg>'}

(function(){
 const LK='sa_auth',DAYS=30;

 function unlock(){$('gate').remove();$('side').style.display='';$('main').style.display='';draw()}

  e.preventDefault();const btn=$('gbtn'),msg=$('gmsg');btn.disabled=true;msg.style.color='#9ab';msg.textContent='Checking...';

   const d=await r.json();
   if(d.ok){localStorage.setItem(LK,JSON.stringify({exp:Date.now()+DAYS*864e5}));unlock()}
   else{msg.style.color='#f66';msg.textContent=d.msg||'Activation failed';btn.disabled=false}
  }catch(err){msg.style.color='#f66';msg.textContent='Network error - try again';btn.disabled=false}
 };
})();
