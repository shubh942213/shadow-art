<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}
:root{--bg:#070b10;--panel:#0e151d;--panel2:#121b25;--line:#263548;--text:#eaf0f6;--muted:#899bb0;--accent:#ffb84d;--accent2:#ff8a3d}
body{font:13px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
#shell{height:100vh;display:flex;flex-direction:column;background:linear-gradient(135deg,#080c11,#0c1219 60%,#080c12)}
#top{height:66px;display:flex;align-items:center;gap:14px;padding:9px 15px;border-bottom:1px solid var(--line);background:rgba(9,14,20,.97);box-shadow:0 8px 28px rgba(0,0,0,.2);z-index:20}
#brand{display:flex;align-items:center;gap:10px;min-width:250px}
#mark{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-weight:950;color:#1b1209;background:linear-gradient(135deg,var(--accent),#ffe1a7);box-shadow:0 6px 22px rgba(255,184,77,.12)}
#brand h1{font-size:17px;line-height:1.05;margin:0;font-weight:850;letter-spacing:-.02em}
#brand small{display:block;color:var(--muted);font-size:9.5px;margin-top:3px}
#nav{display:flex;align-items:center;gap:6px}
#nav button{height:38px;padding:0 15px;border-radius:9px;border:1px solid #304053;background:#121c27;color:#a9b9ca;font-weight:800;cursor:pointer}
#nav button:hover{background:#192533;color:#e3ebf4}
#nav button.active{background:linear-gradient(180deg,#2b3b4b,#1d2935);color:#fff;border-color:#50677e}
#actions{margin-left:auto;display:flex;align-items:center;gap:8px}
#filenameWrap{display:flex;align-items:center;gap:7px;padding:5px 8px;border:1px solid #2d3d50;border-radius:9px;background:#0d141c}

#fileName::placeholder{color:#53677b}

#generateBtn:hover{filter:brightness(1.06);transform:translateY(-1px)}

.toolAction:hover{background:#1b2a39;color:#fff;border-color:#4a6480;transform:translateY(-1px)}
.toolAction:disabled{opacity:.5;cursor:wait;transform:none}
.toolAction.primary{border-color:#ffd17e;background:linear-gradient(180deg,#ffc45c,#ff9945);color:#1b1004;box-shadow:0 6px 18px rgba(255,160,70,.12)}
#workspace{position:relative;flex:1;min-height:0}
.toolFrame{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:#0b0f14}
.toolFrame.active{display:block}
#loader{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(4,8,12,.72);backdrop-filter:blur(5px);z-index:1000}
#loaderCard{width:360px;padding:22px;background:#101821;border:1px solid #2c3c4f;border-radius:14px;box-shadow:0 24px 80px rgba(0,0,0,.55)}
#spinner{width:32px;height:32px;border:3px solid #2b3949;border-top-color:var(--accent);border-radius:50%;animation:spin .85s linear infinite;margin:0 auto 12px}
#loadTitle{text-align:center;font-size:14px;font-weight:850}#loadMsg{text-align:center;color:var(--muted);font-size:11px;margin-top:4px;min-height:16px}
#loadBar{height:7px;border-radius:99px;background:#0b1118;border:1px solid #2b3949;overflow:hidden;margin-top:14px}
#loadBar i{display:block;width:45%;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));animation:slide 1.2s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes slide{0%{transform:translateX(-120%)}100%{transform:translateX(300%)}}
#status{position:absolute;left:16px;bottom:13px;z-index:10;padding:6px 9px;border:1px solid #26384b;border-radius:8px;background:rgba(10,16,23,.86);color:#7f93a9;font-size:9.5px;pointer-events:none;opacity:0;transition:opacity .2s}
#status.show{opacity:1}
@media(max-width:1100px){#brand{min-width:210px}#filenameWrap{display:none}.toolAction{padding:0 9px;font-size:9px}}
@media(max-width:900px){#projectActions .toolAction:not(.primary){padding:0 7px}.toolAction#loadProjectBtn{display:none}}
@media(max-width:760px){#projectActions{gap:4px}.toolAction{height:36px;padding:0 7px;font-size:8.5px}.toolAction#undoBtn,.toolAction#redoBtn{width:34px;padding:0;font-size:18px}}
@media(max-width:760px){#top{height:58px;padding:8px 10px;gap:8px}#brand small{display:none}#brand h1{font-size:14px}#mark{width:32px;height:32px}#brand{min-width:0}#nav button{padding:0 9px;height:34px;font-size:10.5px}#useBtn{height:36px;padding:0 8px;font-size:10px}#generateBtn{height:38px;padding:0 11px;font-size:12px}}

</head><body>
<div id="shell">
<header id="top">
<div id="brand"><div id="mark">R</div><div><h1>Radilux Shadow Art Generator</h1><small>Image preparation • shadow geometry • production exports</small></div></div>
<button id="generateBtn" type="button">GENERATE</button>
<nav id="nav"><button id="tabPrep" class="active">Image Prep</button><button id="tabGen">Shadow Art Generator</button></nav>
<div id="actions">
<div id="filenameWrap"><label for="fileName">File name</label><input id="fileName" value="radilux_shadow_art" placeholder="radilux_shadow_art"></div>
<div id="projectActions">
<button id="undoBtn" class="toolAction" type="button" title="Undo last setting change (Ctrl+Z)">↶</button>

</header>
<main id="workspace"><iframe id="prepFrame" class="toolFrame active" title="Image Prep"></iframe><iframe id="genFrame" class="toolFrame" title="Shadow Art Generator"></iframe><div id="status"></div></main>
</div>
<div id="loader"><div id="loaderCard"><div id="spinner"></div><div id="loadTitle">Generating</div><div id="loadMsg">Please wait…</div><div id="loadBar"><i></i></div></div></div>
<script src="./radilux-engine-v12.js"></script>
<script>
'use strict';
const PREP_B64=window.RADILUX_ENGINE.PREP_B64,GEN_B64=window.RADILUX_ENGINE.GEN_B64,$=id=>document.getElementById(id);
function decodeB64(s){const bytes=Uint8Array.from(atob(s),c=>c.charCodeAt(0));return new TextDecoder().decode(bytes)}
const prepFrame=$('prepFrame'),genFrame=$('genFrame');
prepFrame.srcdoc=decodeB64(PREP_B64);
let genLoaded=false,genLoadingPromise=null;
function ensureGenLoaded(){
  if(genLoaded)return Promise.resolve(genFrame);
  if(genLoadingPromise)return genLoadingPromise;
  genLoadingPromise=new Promise(resolve=>{
    const onload=()=>{genLoaded=true;genFrame.removeEventListener('load',onload);resolve(genFrame)};
    genFrame.addEventListener('load',onload);
    genFrame.srcdoc=decodeB64(GEN_B64);
  });
  return genLoadingPromise;
}
let activeTool='prep',dirty=false,RADILUX_FILE_NAME='radilux_shadow_art';
let currentInputFile=null;
let history=[],historyIndex=-1,historyTimer=null,suppressHistory=false,lastHistorySig='';
window.RADILUX_FILE_NAME=RADILUX_FILE_NAME;

function cleanFileBase(v){return String(v||'radilux_shadow_art').trim().replace(/\.[A-Za-z0-9]{1,8}$/,'').replace(/[^A-Za-z0-9_-]+/g,'_').replace(/^_+|_+$/g,'')||'radilux_shadow_art'}
$('fileName').addEventListener('input',e=>{RADILUX_FILE_NAME=cleanFileBase(e.target.value);window.RADILUX_FILE_NAME=RADILUX_FILE_NAME;scheduleHistoryCommit()});
function showRadiluxLoading(title,msg){$('loadTitle').textContent=title||'Generating';$('loadMsg').textContent=msg||'Please wait…';$('loader').style.display='flex'}
function hideRadiluxLoading(){$('loader').style.display='none'}
window.showRadiluxLoading=showRadiluxLoading;window.hideRadiluxLoading=hideRadiluxLoading;
function setRadiluxDirty(v){dirty=!!v;$('status').textContent=dirty?'Changes not generated yet':'Ready';$('status').classList.toggle('show',dirty)}
window.setRadiluxDirty=setRadiluxDirty;

function switchTool(tool){
 activeTool=tool;
 $('tabPrep').classList.toggle('active',tool==='prep');
 $('tabGen').classList.toggle('active',tool==='gen');
 prepFrame.classList.toggle('active',tool==='prep');
 genFrame.classList.toggle('active',tool==='gen');
 $('generateBtn').style.display=tool==='gen'?'inline-flex':'none';
}

async function frameGenerate(){
 if(activeTool!=='gen')return;
 showRadiluxLoading('Shadow art generation','Processing current settings…');
 $('generateBtn').classList.add('busy');
 try{
  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
  await ensureGenLoaded();
  const api=genFrame.contentWindow.RadiluxGenerator;
  if(api&&api.generate)api.generate();
  setRadiluxDirty(false);
 }catch(e){console.error(e);alert('Generation failed: '+e.message)}finally{hideRadiluxLoading();$('generateBtn').classList.remove('busy')}
}

async function usePrepared(){
 const api=prepFrame.contentWindow.RadiluxPrep;
 if(!api||!api.hasResult||!api.hasResult()){alert('Generate the prepared image first.');return}
 const url=api.getResultDataURL();
 if(!url){alert('No prepared result is available.');return}
 showRadiluxLoading('Sending artwork','Loading prepared silhouette into Shadow Art Generator…');
 switchTool('gen');
 try{
  await ensureGenLoaded();
  attachGeneratorHooks();
  const g=genFrame.contentWindow.RadiluxGenerator;
  if(g&&g.setImageDataURL)await g.setImageDataURL(url,'Prepared artwork');
  dirty=false;
 }catch(e){console.error(e);alert('Could not send the artwork to the Shadow Art Generator: '+e.message)}
 finally{hideRadiluxLoading()}
}
window.usePreparedFromPrep=usePrepared;
$('tabPrep').onclick=()=>switchTool('prep');
$('tabGen').onclick=async()=>{
 switchTool('gen');
 if(!genLoaded){showRadiluxLoading('Loading Shadow Art Generator','Starting the 3D engine…')}
 try{await ensureGenLoaded();attachGeneratorHooks()}catch(e){console.error(e);alert('Could not load the Shadow Art Generator: '+e.message)}
 finally{hideRadiluxLoading()}
};
$('generateBtn').onclick=frameGenerate;
window.addEventListener('message',e=>{if(e.data&&e.data.type==='radilux-dirty')setRadiluxDirty(true)});

// ---------- Frame state / undo / redo ----------
function frameValues(frame){
 if(!frame||!frame.contentDocument)return null;
 const out={};
 frame.contentDocument.querySelectorAll('input,select,textarea').forEach(el=>{
  if(!el.id)return;
  if(el.type==='file')return; // file inputs cannot be meaningfully saved/restored
  out[el.id]={type:el.type||el.tagName.toLowerCase(),value:el.value,checked:!!el.checked};
 });
 const prepView=frame.contentDocument.querySelector('#viewToggle button.on');
 if(prepView)out.__view=prepView.dataset.v||'';
 const activeGenTab=frame.contentDocument.querySelector('#tabs button.o');
 if(activeGenTab)out.__genTab=activeGenTab.id||'';
 return out;
}
function frameState(){
 return {
  prep:frameValues(prepFrame),
  gen:frameValues(genFrame),
  fileName:RADILUX_FILE_NAME,
  inputName:currentInputFile?currentInputFile.name:''
 };
}
function stateSignature(st){
 const clean=o=>{if(!o)return null;const x={};Object.keys(o).sort().forEach(k=>x[k]=o[k]);return x};
 return JSON.stringify({prep:clean(st.prep),gen:clean(st.gen),fileName:st.fileName,inputName:st.inputName});
}
function updateHistoryButtons(){
 $('undoBtn').disabled=historyIndex<=0;
 $('redoBtn').disabled=historyIndex<0||historyIndex>=history.length-1;
}
function resetHistory(){
 clearTimeout(historyTimer);history=[];historyIndex=-1;lastHistorySig='';
 if(prepFrame.contentDocument){const st=frameState();history=[st];historyIndex=0;lastHistorySig=stateSignature(st)}
 updateHistoryButtons();
}
function scheduleHistoryCommit(){
 if(suppressHistory)return;
 clearTimeout(historyTimer);
 historyTimer=setTimeout(commitHistory,350);
}
function commitHistory(){
 if(suppressHistory)return;
 const st=frameState();if(!st)return;
 const sig=stateSignature(st);if(sig===lastHistorySig)return;
 if(historyIndex<history.length-1)history=history.slice(0,historyIndex+1);
 history.push(st);historyIndex++;lastHistorySig=sig;
 if(history.length>60){history.shift();historyIndex--;};
 updateHistoryButtons();
}
async function applyFrameState(st){
 if(!st)return;
 suppressHistory=true;
 try{
  RADILUX_FILE_NAME=cleanFileBase(st.fileName||'radilux_shadow_art');$('fileName').value=RADILUX_FILE_NAME;window.RADILUX_FILE_NAME=RADILUX_FILE_NAME;
  const restore=(frame,obj)=>{
   if(!frame||!obj||!frame.contentDocument)return;
   Object.entries(obj).forEach(([id,v])=>{
    if(id.startsWith('__'))return;
    const el=frame.contentDocument.getElementById(id);if(!el)return;
    if(el.type==='file')return; // browser security: file inputs can only be set to empty string
    if(el.type==='checkbox')el.checked=!!v.checked;else el.value=v.value;
   });
  };
  restore(prepFrame,st.prep);
  restore(genFrame,st.gen);
  if(st.prep&&st.prep.__view){
   const b=prepFrame.contentDocument.querySelector(`#viewToggle button[data-v="${CSS.escape(st.prep.__view)}"]`);if(b)b.click();
  }
  if(st.gen&&st.gen.__genTab){const b=genFrame.contentDocument.getElementById(st.gen.__genTab);if(b)b.click()}
  const pa=prepFrame.contentWindow.RadiluxPrep;
  if(pa&&pa.hasImage&&pa.hasImage()&&pa.generate)pa.generate();
  const ga=genFrame.contentWindow.RadiluxGenerator;
  if(ga&&ga.generate&&ga.isDirty&&ga.isDirty())ga.generate();
  if(ga&&ga.setImageDataURL&&pa&&pa.getResultDataURL){
    const u=pa.getResultDataURL();if(u)await ga.setImageDataURL(u,'Prepared artwork');
  }
  dirty=false;setRadiluxDirty(false);
 }finally{suppressHistory=false}
}
async function undo(){
 if(historyIndex<=0)return;
 historyIndex--;
 if(history[historyIndex]&&history[historyIndex].gen&&!genLoaded)await ensureGenLoaded();
 if(genLoaded)attachGeneratorHooks();
 await applyFrameState(history[historyIndex]);
 lastHistorySig=stateSignature(history[historyIndex]);updateHistoryButtons();
}
async function redo(){
 if(historyIndex>=history.length-1)return;
 historyIndex++;
 if(history[historyIndex]&&history[historyIndex].gen&&!genLoaded)await ensureGenLoaded();
 if(genLoaded)attachGeneratorHooks();
 await applyFrameState(history[historyIndex]);
 lastHistorySig=stateSignature(history[historyIndex]);updateHistoryButtons();
}
$('undoBtn').onclick=undo;$('redoBtn').onclick=redo;
document.addEventListener('keydown',e=>{
 const mod=e.ctrlKey||e.metaKey;if(!mod)return;
 if(e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo()}
 else if(e.key.toLowerCase()==='y'){e.preventDefault();redo()}
});

function bindFrameHistory(frame,kind){
 if(!frame||!frame.contentDocument)return;
 const doc=frame.contentDocument;
 doc.querySelectorAll('input,select,textarea').forEach(el=>{
  if(el.dataset.radiluxHostHook)return;
  el.dataset.radiluxHostHook='1';
  const onChange=()=>{
   if(el.type==='file' && el.files&&el.files[0])currentInputFile=el.files[0];
   scheduleHistoryCommit();
  };
  el.addEventListener('input',onChange);el.addEventListener('change',onChange);
 });
 if(kind==='prep'){
  const vf=doc.querySelector('#viewToggle');
  vf&&vf.querySelectorAll('button').forEach(b=>b.addEventListener('click',scheduleHistoryCommit));
 }
 if(historyIndex<0)resetHistory();
 else updateHistoryButtons();
}
function attachPrepHooks(){
 try{bindFrameHistory(prepFrame,'prep');bindFrameShortcuts(prepFrame)}catch(e){console.warn('prep hooks',e)}
}
function attachGeneratorHooks(){
 try{bindFrameHistory(genFrame,'gen');bindFrameShortcuts(genFrame)}catch(e){console.warn('generator hooks',e)}
}
function bindFrameShortcuts(frame){
 try{
  const doc=frame.contentDocument;if(!doc||doc.documentElement.dataset.radiluxHistoryKeys)return;
  doc.documentElement.dataset.radiluxHistoryKeys='1';
  doc.addEventListener('keydown',e=>{
   const mod=e.ctrlKey||e.metaKey;if(!mod)return;
   if(e.key.toLowerCase()==='z'){e.preventDefault();e.stopPropagation();e.shiftKey?redo():undo()}
   else if(e.key.toLowerCase()==='y'){e.preventDefault();e.stopPropagation();redo()}
  },true);
 }catch(e){}
}
prepFrame.addEventListener('load',()=>{attachPrepHooks();try{
 const f=prepFrame.contentDocument&&prepFrame.contentDocument.getElementById('fileInput');
 f&&f.addEventListener('change',()=>{if(f.files&&f.files[0]){currentInputFile=f.files[0];resetHistory()}});
}catch(e){}});

// ---------- ZIP project writer/reader (STORE method, self-contained; no external library) ----------
const CRC_TABLE=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xedb88320^(c>>>1)):(c>>>1);t[n]=c>>>0}return t})();
function crc32(bytes){let c=0xffffffff;for(let i=0;i<bytes.length;i++)c=CRC_TABLE[(c^bytes[i])&255]^(c>>>8);return (c^0xffffffff)>>>0}
const u16=(v)=>{const a=new Uint8Array(2);a[0]=v&255;a[1]=(v>>>8)&255;return a};
const u32=(v)=>{const a=new Uint8Array(4);a[0]=v&255;a[1]=(v>>>8)&255;a[2]=(v>>>16)&255;a[3]=(v>>>24)&255;return a};
function dosNow(){const d=new Date();return {time:(d.getHours()<<11)|(d.getMinutes()<<5)|Math.floor(d.getSeconds()/2),date:((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate()}}
function zipMake(entries){
 const enc=new TextEncoder(),parts=[],central=[];let offset=0;const dt=dosNow();
 for(const e of entries){
  const name=enc.encode(e.name),data=e.data instanceof Uint8Array?e.data:new Uint8Array(e.data),crc=crc32(data);
  const h=new Uint8Array(30+name.length);let p=0;h.set(u32(0x04034b50),p);p+=4;h.set(u16(20),p);p+=2;h.set(u16(0x0800),p);p+=2;h.set(u16(0),p);p+=2;h.set(u16(dt.time),p);p+=2;h.set(u16(dt.date),p);p+=2;h.set(u32(crc),p);p+=4;h.set(u32(data.length),p);p+=4;h.set(u32(data.length),p);p+=4;h.set(u16(name.length),p);p+=2;h.set(u16(0),p);p+=2;h.set(name,p);parts.push(h,data);
  const c=new Uint8Array(46+name.length);p=0;c.set(u32(0x02014b50),p);p+=4;c.set(u16(20),p);p+=2;c.set(u16(20),p);p+=2;c.set(u16(0x0800),p);p+=2;c.set(u16(0),p);p+=2;c.set(u16(dt.time),p);p+=2;c.set(u16(dt.date),p);p+=2;c.set(u32(crc),p);p+=4;c.set(u32(data.length),p);p+=4;c.set(u32(data.length),p);p+=4;c.set(u16(name.length),p);p+=2;c.set(u16(0),p);p+=2;c.set(u16(0),p);p+=2;c.set(u16(0),p);p+=2;c.set(u16(0),p);p+=2;c.set(u32(0),p);p+=4;c.set(u32(offset),p);p+=4;c.set(name,p);central.push(c);offset+=h.length+data.length;
 }
 const cdSize=central.reduce((a,b)=>a+b.length,0),cdStart=offset;central.forEach(c=>parts.push(c));const end=new Uint8Array(22);let p=0;end.set(u32(0x06054b50),p);p+=4;end.set(u16(0),p);p+=2;end.set(u16(0),p);p+=2;end.set(u16(entries.length),p);p+=2;end.set(u16(entries.length),p+=0); /* keep p position explicit below */
 // rewrite EOCD cleanly because the offset expression above is intentionally compact.
 const eocd=new Uint8Array(22);p=0;eocd.set(u32(0x06054b50),p);p+=4;eocd.set(u16(0),p);p+=2;eocd.set(u16(0),p);p+=2;eocd.set(u16(entries.length),p);p+=2;eocd.set(u16(entries.length),p);p+=2;eocd.set(u32(cdSize),p);p+=4;eocd.set(u32(cdStart),p);p+=4;eocd.set(u16(0),p);parts.push(eocd);return new Blob(parts,{type:'application/zip'});
}
function safeZipPath(p){return typeof p==='string'&&p.startsWith('input/')&&!p.includes('..')&&!p.includes('\\')&&!p.endsWith('/')}
function findEOCD(bytes){for(let i=bytes.length-22;i>=0;i--)if(bytes[i]===0x50&&bytes[i+1]===0x4b&&bytes[i+2]===0x05&&bytes[i+3]===0x06)return i;return -1}
async function zipReadEntries(bytes){
 const eocd=findEOCD(bytes);if(eocd<0)throw new Error('Not a valid Radilux project ZIP');
 const dv=new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength);
 const count=dv.getUint16(eocd+10,true);
 const cdOff=dv.getUint32(eocd+16,true);
 const out={};let p=cdOff;
 const str=a=>new TextDecoder().decode(a);
 for(let n=0;n<count;n++){
   if(dv.getUint32(p,true)!==0x02014b50)throw new Error('Invalid project ZIP directory');
   const flags=dv.getUint16(p+8,true),method=dv.getUint16(p+10,true),csize=dv.getUint32(p+20,true),usize=dv.getUint32(p+24,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),localOff=dv.getUint32(p+42,true);
   const name=str(bytes.subarray(p+46,p+46+nl));
   if(flags&1)throw new Error('Encrypted project files are not supported');
   const ldv=new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength);
   if(ldv.getUint32(localOff,true)!==0x04034b50)throw new Error('Invalid project ZIP local header');
   const lnl=ldv.getUint16(localOff+26,true),lxl=ldv.getUint16(localOff+28,true),dataStart=localOff+30+lnl+lxl;
   const compressed=bytes.subarray(dataStart,dataStart+csize);
   let data;
   if(method===0){data=new Uint8Array(compressed)}
   else if(method===8){
     if(typeof DecompressionStream!=='function')throw new Error('This browser cannot decompress standard ZIP files. Use a Radilux project ZIP created by the app.');
     const ds=new DecompressionStream('deflate-raw');
     const stream=new Blob([compressed]).stream().pipeThrough(ds);
     data=new Uint8Array(await new Response(stream).arrayBuffer());
     if(usize && data.length!==usize)throw new Error('Project ZIP entry size mismatch: '+name);
   } else throw new Error('Unsupported ZIP compression method '+method+' in entry '+name);
   out[name]=data;
   p+=46+nl+xl+cl;
 }
 return out;
}
function dataURLBytes(url){const m=String(url||'').match(/^data:.*?;base64,(.*)$/);if(!m)return new Uint8Array();const s=atob(m[1]),a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a}
function blobBytes(blob){return blob.arrayBuffer().then(b=>new Uint8Array(b))}
function fileType(name){const e=(name.split('.').pop()||'').toLowerCase();return e==='png'?'image/png':e==='jpg'||e==='jpeg'?'image/jpeg':e==='webp'?'image/webp':'application/octet-stream'}

// ---------- Project save/load ----------
async function exportProject(){
 const gen=genFrame.contentWindow&&genFrame.contentWindow.RadiluxGenerator;
 const prepApi=prepFrame.contentWindow&&prepFrame.contentWindow.RadiluxPrep;
 if(!currentInputFile){
  try{currentInputFile=prepFrame.contentDocument?.getElementById('fileInput')?.files?.[0]||genFrame.contentDocument?.getElementById('f')?.files?.[0]||null}catch(e){}
 }
 if(!currentInputFile){alert('Upload an image first.');return}
 $('exportProjectBtn').disabled=true;$('loadProjectBtn').disabled=true;
 showRadiluxLoading('Exporting Radilux Project','Preparing all production files…');
 try{
  if(!prepApi||!prepApi.hasResult||!prepApi.hasResult()){alert('Image Prep has no generated result.');return}
  const prepPng=dataURLBytes(prepApi.getResultDataURL());
  if(!gen||!gen.setImageDataURL)await ensureGenLoaded();
  attachGeneratorHooks();
  const g=genFrame.contentWindow.RadiluxGenerator;
  if(g.isDirty&&g.isDirty())g.generate();
  if(!g.hasImage || true){
   const u=prepApi.getResultDataURL();if(u)await g.setImageDataURL(u,'Prepared artwork');
  }
  const outputs=await g.buildProjectOutputs((m,f)=>{$('loadMsg').textContent=m;});
  const base=cleanFileBase($('fileName').value||'radilux_shadow_art');
  const inputPath='input/'+currentInputFile.name.replace(/[^A-Za-z0-9._-]+/g,'_');
  const project={
    schema:1,app:'Radilux Shadow Art Generator',version:'commercial-project-v1',savedAt:new Date().toISOString(),
    fileName:base,input:{name:currentInputFile.name,path:inputPath,type:currentInputFile.type||fileType(currentInputFile.name)},
    prep:frameValues(prepFrame),generator:frameValues(genFrame),
    outputs:{svg:'exports/'+base+'.svg',png:'exports/'+base+'.png',dxf:'exports/'+base+'.dxf',stl:'exports/'+base+'.stl',glb:'exports/'+base+'.glb',py:'exports/'+base+'.py'}
  };
  const entries=[
   {name:'project.json',data:new TextEncoder().encode(JSON.stringify(project,null,2))},
   {name:inputPath,data:new Uint8Array(await currentInputFile.arrayBuffer())},
   {name:'exports/'+base+'.png',data:prepPng},
   {name:'exports/'+base+'.svg',data:new TextEncoder().encode(outputs.svg)},
   {name:'exports/'+base+'.dxf',data:new TextEncoder().encode(outputs.dxf)},
   {name:'exports/'+base+'.stl',data:new Uint8Array(outputs.stl)},
   {name:'exports/'+base+'.glb',data:new Uint8Array(outputs.glb)},
   {name:'exports/'+base+'.py',data:new TextEncoder().encode(outputs.py)}
  ];
  const zip=zipMake(entries);
  const a=document.createElement('a');a.href=URL.createObjectURL(zip);a.download=base+'.radilux.zip';document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(()=>URL.revokeObjectURL(a.href),5000);
  setRadiluxDirty(false);hideRadiluxLoading();showToastOuter('Project exported successfully');
 }catch(e){console.error(e);hideRadiluxLoading();alert('Project export failed: '+e.message)}
 finally{$('exportProjectBtn').disabled=false;$('loadProjectBtn').disabled=false}
}
async function loadProject(file){
 $('exportProjectBtn').disabled=true;$('loadProjectBtn').disabled=true;showRadiluxLoading('Loading Radilux Project','Reading project configuration…');
 try{
  const entries=await zipReadEntries(new Uint8Array(await file.arrayBuffer()));
  if(!entries['project.json'])throw new Error('project.json not found in the selected project file');
  const project=JSON.parse(new TextDecoder().decode(entries['project.json']));
  if(!project.input||!safeZipPath(project.input.path))throw new Error('Project input path is invalid. Only files inside the input/ folder are allowed.');
  if(!entries[project.input.path])throw new Error('The configured input image is missing from the project input/ folder.');
  const inputBytes=entries[project.input.path];
  const imageName=project.input.name||project.input.path.split('/').pop();
  currentInputFile=new File([inputBytes],imageName,{type:project.input.type||fileType(imageName)});
  await switchTool('prep');
  const pf=prepFrame.contentWindow;
  if(typeof pf.handleFiles!=='function')throw new Error('Image Prep is not ready');
  suppressHistory=true;
  pf.handleFiles([currentInputFile]);
  showRadiluxLoading('Loading Radilux Project','Restoring image preparation settings…');
  const wait=async(fn,ms=12000)=>{const t=Date.now();while(Date.now()-t<ms){if(fn())return;await new Promise(r=>setTimeout(r,80))}throw new Error('Timed out while loading project')};
  await wait(()=>pf.RadiluxPrep&&pf.RadiluxPrep.hasImage&&pf.RadiluxPrep.hasImage()&&pf.RadiluxPrep.hasResult&&pf.RadiluxPrep.hasResult());
  await ensureGenLoaded();
  attachGeneratorHooks();
  /* gen:project.generator (not applyFrameState's own ga.generate() pass, which would run
     against whatever image the generator currently happens to have) restores every saved
     field - including which generator sub-tab (3D view / Shadow test / Cut layout) was
     active - before the real image is attached below. */
  await applyFrameState({prep:project.prep,gen:project.generator,fileName:project.fileName||'radilux_shadow_art'});
  /* applyFrameState already restores the generator's fields, regenerates the prepped
     image, and awaits sending that fresh image into the generator - so there is nothing
     left to do here. A second, un-awaited setImageDataURL()+generate() call used to run
     right here against whichever *old* image the generator still had while the new one
     was still loading in the background, which is what produced incorrect/erroring
     results after loading a project. */
  dirty=false;setRadiluxDirty(false);
  suppressHistory=false;resetHistory();
  hideRadiluxLoading();showToastOuter('Project loaded successfully');
 }catch(e){console.error(e);hideRadiluxLoading();alert('Project load failed: '+e.message);suppressHistory=false}
 finally{$('exportProjectBtn').disabled=false;$('loadProjectBtn').disabled=false}
}
function showToastOuter(msg){let t=$('outerToast');if(!t){t=document.createElement('div');t.id='outerToast';Object.assign(t.style,{position:'fixed',right:'18px',bottom:'18px',zIndex:2000,padding:'10px 14px',borderRadius:'9px',background:'#142333',border:'1px solid #35516a',color:'#d9e7f4',fontSize:'11px',fontWeight:'800',boxShadow:'0 10px 30px rgba(0,0,0,.35)',transition:'opacity .25s'});document.body.appendChild(t)}t.textContent=msg;t.style.opacity='1';clearTimeout(t._tid);t._tid=setTimeout(()=>t.style.opacity='0',2600)}
$('exportProjectBtn').onclick=exportProject;
$('loadProjectBtn').onclick=()=>$('projectFileInput').click();
$('projectFileInput').addEventListener('change',()=>{const f=$('projectFileInput').files[0];if(f)loadProject(f);$('projectFileInput').value=''});

// Initialize history once Image Prep finishes its first load, and keep the original prep auto-generation behavior intact.
setTimeout(()=>{try{attachPrepHooks()}catch(e){}},200);
</script></body></html>
