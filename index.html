<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Radilux Shadow Art Generator v1.1</title>
<style>

*{box-sizing:border-box}html,body{height:100%}

#side{overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column}
#sideBody{overflow:auto;padding:14px;flex:1;min-height:0}
#sideFoot{flex:0 0 auto;padding:12px 14px;border-top:1px solid var(--line);background:var(--panel2);display:flex;gap:8px;flex-wrap:wrap}
#sideFoot button{flex:1;margin:0;min-width:120px}
#sideBody>b{display:block;font-size:12px;color:var(--sub);font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}
#sideBody label{display:grid;grid-template-columns:1fr 88px;gap:6px;margin:5px 0;align-items:center}
#sideBody label span{color:#c7cbdb;cursor:help;border-bottom:1px dotted #444;width:fit-content}
input,button,select{font:inherit}
input[type=number]{width:88px;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:5px 7px;outline:none}

details[open] summary::before{transform:rotate(90deg)}
.sec{padding:2px 2px 8px}
#main{display:flex;flex-direction:column;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}

#cv{flex:1;min-height:0;width:100%;touch-action:none;cursor:grab;background:radial-gradient(circle at 50% 35%,#1b1e29,#101116 75%)}

#gate button{width:100%;margin-top:16px;padding:10px;background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;border:0;border-radius:7px;cursor:pointer;font-weight:700}
#gate button:disabled{opacity:.6;cursor:default}
#gmsg{margin-top:10px;font-size:12px;min-height:14px}

(()=>{let html='',open=false;FD.forEach(d=>{

 else html+=`<label><span title="${HINTS[d[0]]||''}">${d[1]}</span><input type=number step=any id=${d[0]} value=${d[2]} title="${HINTS[d[0]]||''}"></label>`});
 if(open)html+='</div></details>';return html})();
$('sideFoot').innerHTML='<button id=bs>Download SVG</button><button id=bd>Download DXF</button><button id=bstl class=o>Download STL</button>';
let P={},S=1,N=1024,G=new Float32Array(N*N),img=null,PN=[],GL=[],shDirty=1,tab=0,tm,cam={y:-.7,p:.5,z:1.5},dr=null;

 P.hbox=Math.min(P.hbox,P.H); P.bay=Math.min(P.bay,P.hbox-1); P.box=Math.max(P.box,10); P.t=Math.max(P.t,.5);
 S=.1/Math.max(P.ssize,1)}
function ingest(){if(!img)return;const c=document.createElement('canvas');c.width=c.height=N;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0,N,N);const d=x.getImageData(0,0,N,N).data,iv=$('inv').checked;
 for(let i=0;i<N*N;i++){const a=d[4*i+3]/255,l=(.299*d[4*i]+.587*d[4*i+1]+.114*d[4*i+2])/255;G[i]=a*(iv?l:1-l)}}

 return(G[k]*(1-fx)+G[k+1]*fx)*(1-fy)+(G[k+N]*(1-fx)+G[k+N+1]*fx)*fy}
function mask(X,Y){X-=P.mx;Y-=P.my;return gs(X/P.ssize+.5,.5-Y/P.ssize)}
function pf(p,s,z){if(z<P.bay)return 1;

function panels(){const B=P.box,t=P.t,w2=Math.max(B-2*t,1);return[
 {n:'Front',ax:'y',c:-(B/2-t/2),sg:1,w:B},
 {n:'Back', ax:'y',c: (B/2-t/2),sg:-1,w:B},

// ---- raster grid: build, despeckle, bridge, then extract Chaikin-smoothed loops ----
function buildF(fn,x0,y0,x1,y1,h,lv){

function components(F,X,Y){

 for(let s=0;s<X*Y;s++){if(F[s]<=0||lab[s]>=0)continue;const stack=[s];lab[s]=nc;const cells=[];
  while(stack.length){const k=stack.pop();cells.push(k);const a=k%X;

   for(const[nb,ok]of nbrs){if(!ok||nb<0||nb>=X*Y)continue;if(F[nb]>0&&lab[nb]<0){lab[nb]=nc;stack.push(nb)}}}

function despeckleF(F,X,Y,h,minArea){

function segDist(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;let t=l?((px-ax)*dx+(py-ay)*dy)/l:0;t=Math.max(0,Math.min(1,t));

  if(segDist(X0,Y0,p[0],p[1],q[0],q[1])<=w/2)F[b*X+a]=Math.max(F[b*X+a],1)}}
function bridgeF(F,X,Y,x0,y0,h,bw){
 const comps=components(F,X,Y);if(comps.length<=1)return{made:0,segs:[]};
 const pts=comps.map(cells=>{const b=boundaryPts(cells,F,X,x0,y0,h),st=Math.max(1,Math.floor(b.length/150));return b.filter((_,i)=>i%st===0)});
 const n=pts.length,used=new Array(n).fill(false);used[0]=true;let cnt=1;const segs=[];
 while(cnt<n){let bj=-1,bp=null,bq=null,bd=Infinity;
  for(let i=0;i<n;i++)if(used[i])for(let j=0;j<n;j++)if(!used[j])
   for(const p of pts[i])for(const q of pts[j]){const d=(p[0]-q[0])**2+(p[1]-q[1])**2;if(d<bd){bd=d;bj=j;bp=p;bq=q}}
  if(bj<0)break;paintBridge(F,X,Y,x0,y0,h,bp,bq,bw);used[bj]=true;cnt++;segs.push([bp,bq])}

function dilateF(F,X,Y,rc){
 if(rc<=0)return;const src=F.slice();

  if(hit)F[b*X+a]=1}}
function chaikin(pts,iters){
 for(let it=0;it<iters;it++){const out=[],n=pts.length;

   out.push([p0[0]*.75+p1[0]*.25,p0[1]*.75+p1[1]*.25]);
   out.push([p0[0]*.25+p1[0]*.75,p0[1]*.25+p1[1]*.75]);}

const sd=(p,a,b)=>{const dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy;return l?Math.abs(dy*(p[0]-a[0])-dx*(p[1]-a[1]))/Math.sqrt(l):Math.hypot(p[0]-a[0],p[1]-a[1])};

function buildPanels(st,kerf){return panels().map(p=>processPanel(p,st,kerf||0))}
const ar=l=>{let s=0;for(let i=0;i<l.length;i++){const a=l[i],b=l[(i+1)%l.length];s+=a[0]*b[1]-b[0]*a[1]}return s/2};

function info(){let s=`Light sits ${P.H} mm above the base; box walls are ${P.hbox} mm tall (light may sit above the open top). Bottom ${P.bay} mm of every wall is solid - room for a battery + switch.\nSquare footprint ${P.box} x ${P.box} mm, ${P.t} mm sheet. Order in export: Front, Back, Left, Right, Base.\n`;

function draw3(){const g=cv.getContext('2d'),w=cv.width=cv.clientWidth,h=cv.height=cv.clientHeight;g.clearRect(0,0,w,h);

function classifyLoops(loops){
